# ==========================================
# Site Settings
# ==========================================
title: "Kyongman Heo"
locale: "en-US"
description: "Herpetologist & Evolutionary Biologist"

# ==========================================
# Site Author (왼쪽 프로필 영역 설정)
# ==========================================
author:
  name: "Kyongman Heo (허경만)"
  bio: "Herpetology, Conservation Biology, Ecological Adaptation"
  location: "South Korea"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:your-email@email.com"
    - label: "ResearchGate"
      icon: "fab fa-fw fa-researchgate"
      url: "https://www.researchgate.net/profile/Kyongman-Heo"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com"

# ==========================================
# Theme Settings
# ==========================================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# ==========================================
# Collections (★ 404 에러 해결 핵심 코드!)
# ==========================================
collections:
  pages:
    output: true
    permalink: /:path/

# ==========================================
# Site Defaults
# ==========================================
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true

# ==========================================
# Plugins
# ==========================================
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
