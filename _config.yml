# ==========================================
# Site Settings (CSS 깨짐 방지를 위해 주소 필수 지정!)
# ==========================================
title: "Kyongman Heo"
locale: "en-US"
description: "Herpetologist & Evolutionary Biologist"
url: "https://kyongmanheo.github.io"
baseurl: "" # 빈칸으로 둡니다.

# ==========================================
# Site Author (왼쪽 프로필 영역 설정)
# ==========================================
author:
  name: "Kyongman Heo (허경만)"
  bio: "Herpetology, Conservation Biology, Ecological Adaptation"
  location: "South Korea"
  avatar: "/assets/images/profile.jpg"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:kmheo3187@gmail.com" # mailto: 추가
    - label: "ResearchGate"
      icon: "fab fa-fw fa-researchgate"
      url: "https://www.researchgate.net/profile/Kyongman-Heo"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/kyongmanheo"
    - label: "iNaturalist"
      icon: "fas fa-fw fa-leaf" # 나뭇잎 아이콘
      url: "https://www.inaturalist.org/people/YOUR_INAT_USERNAME" # iNaturalist ID 입력

# ==========================================
# Theme Settings
# ==========================================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# ==========================================
# Collections
# ==========================================
collections:
  pages:
    output: true
    permalink: /:path/

# ==========================================
# Site Defaults
# ==========================================
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true

# ==========================================
# Plugins
# ==========================================
plugins:
  - jekyll-paginate
  - jekyll-sitemap # 구글 서치콘솔용 자동 sitemap.xml 생성 플러그인
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
