<!-- 파비콘 설정 -->
<link rel="icon" type="image/png" href="/assets/images/favicon.png">

<style>
  /* 1. 상단 메뉴바 스크롤 고정 (Sticky Header) */
  .masthead {
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
    background-color: #ffffff !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06) !important;
  }

  /* 2. 데스크톱 레이아웃 정돈 (좌측 프로필 + 우측 본문) */
  @media (min-width: 64em) {
    /* 전체 중앙 정렬 및 여백 확보 */
    #main {
      max-width: 1280px !important;
      margin: 0 auto !important;
      padding-left: 2em !important;
      padding-right: 2em !important;
    }

    /* 좌측 프로필 사이드바 위치 고정 */
    .sidebar {
      float: left !important;
      width: 280px !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* 우측 본문 영역 (테마 기본 우측 빈 여백 제거) */
    .page {
      float: right !important;
      width: calc(100% - 310px) !important;
      padding-right: 0 !important; /* 휑하던 오른쪽 여백 300px 삭제 */
    }

    .page__inner-wrap {
      float: none !important;
      width: 100% !important;
      padding: 0 !important;
    }

    /* 본문 및 제목 폰트 크기 세련되게 정돈 */
    .page__title {
      font-size: 2.1rem !important;
      margin-top: 0 !important;
      margin-bottom: 0.6em !important;
    }

    .page__content {
      font-size: 0.98rem !important;
      line-height: 1.7 !important;
    }

    .page__content h2 {
      font-size: 1.35rem !important;
      border-bottom: 1px solid #e9ecef !important;
      padding-bottom: 0.4em !important;
      margin-top: 2em !important;
    }

    .page__content h3 {
      font-size: 1.1rem !important;
      color: #2b8a3e !important; /* 연도 강조 초록색 */
      margin-top: 1.4em !important;
    }
  }

  /* 3. 갤러리 앨범 격자 레이아웃 및 라이트박스 커서 효과 */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 1.2em;
    margin-bottom: 2em;
  }

  .photo-card {
    border: 1px solid #e9ecef;
    border-radius: 8px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .photo-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }

  /* 라이트박스 클릭 링크 영역 및 돋보기 커서 */
  .photo-card a.image-popup {
    display: block;
    cursor: zoom-in;
  }

  .photo-card img {
    width: 100%;
    height: 180px;
    object-fit: cover; /* 사진 비율 깨짐 없이 꽉 채우기 */
    display: block;
  }

  .photo-card p {
    padding: 10px 12px;
    margin: 0;
    font-size: 0.88rem;
    line-height: 1.4;
    color: #333333;
  }
</style>
